[project]
name = "warmline-backend"
version = "0.1.0"
description = "Django REST API for Warmline (Junction 2026)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers --reuse-db"
testpaths = ["apps"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "N", "SIM", "BLE"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
