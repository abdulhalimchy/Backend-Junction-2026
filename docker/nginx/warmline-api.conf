# nginx site for the Warmline API, in front of `docker compose up -d` (the API on 127.0.0.1:8000).
#
#   sudo cp docker/nginx/warmline-api.conf /etc/nginx/sites-available/warmline-api
#   sudo ln -s /etc/nginx/sites-available/warmline-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d junction26.optinnos.com   # adds HTTPS (port 443) and the HTTP -> HTTPS redirect
#
# Do not also run the compose "https" profile (Caddy): both want ports 80 and 443.

server {
    listen 80;
    listen [::]:80;
    server_name junction26.optinnos.com;

    # Pitch-deck uploads (DECK_CHECK_MAX_UPLOAD_MB is 20 by default)
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django uses this to know the request came in over HTTPS (otherwise it redirects forever).
        proxy_set_header X-Forwarded-Proto $scheme;

        # Some requests wait on the LLM for a minute or more (gunicorn allows 180 s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
    }
}
